[package]
name = "fossa-jupiter"
version = "0.1.0"
edition = "2024"
publish = false
description = "Offline Fossa DEX adapter for Jupiter routing"

[features]
snapshot = ["jupiter-amm-test-kit/rpc"]

[dependencies]
borsh = "1.6"
fossa-sdk = { path = "../rust" }
jupiter-amm-interface = { git = "https://github.com/jup-ag/jupiter-amm-interface", rev = "70f56e0495b7c818e4c38e37b2007656892ca2a1" }
rust_decimal = "1.36"
solana-account = "4"
solana-instruction = "3"
solana-pubkey = "4"

[dev-dependencies]
bincode = "1.3"
jupiter-amm-test-kit = { git = "https://github.com/jup-ag/jupiter-amm-interface", rev = "70f56e0495b7c818e4c38e37b2007656892ca2a1", default-features = false }
litesvm = "=0.14.0"
serde_json = "1"
solana-clock = "=3.1.1"
solana-epoch-schedule = "=3.2.0"
solana-fee-calculator = "=3.2.2"
solana-hash = "=4.5.0"
solana-keypair = "3"
solana-last-restart-slot = "=3.1.0"
solana-rent = "=4.3.0"
solana-signer = "3"
solana-slot-history = "=3.1.0"
solana-transaction = "4"
sha2 = "0.10"
spl-token-2022-interface = "2.1"

[[example]]
name = "snapshot"
required-features = ["snapshot"]
