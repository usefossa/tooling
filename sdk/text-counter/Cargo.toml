[package]
name = "fossa-text-counter"
version = "0.1.0"
edition = "2024"
publish = false
description = "Local checkpoint token counting from verified Hugging Face tokenizer and chat template data"

[dependencies]
anyhow = "1"
hex = "0.4"
rquickjs = { version = "=0.14.0", features = ["parallel"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync"] }
